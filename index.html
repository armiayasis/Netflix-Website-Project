<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Generator - Veo 2.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🎬 AI Video Generator</h1>
            <p class="subtitle">Powered by Google Veo 2.0</p>
        </header>

        <div class="generator-section">
            <div class="input-card">
                <h2>Generate Your Video</h2>
                
                <div class="form-group">
                    <label for="prompt">Video Description</label>
                    <textarea 
                        id="prompt" 
                        placeholder="Describe the video you want to generate... Example: A serene beach at sunset with gentle waves"
                        rows="4"
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="duration">Duration (seconds)</label>
                    <select id="duration">
                        <option value="4">4 seconds</option>
                        <option value="6" selected>6 seconds</option>
                        <option value="8">8 seconds</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="aspectRatio">Aspect Ratio</label>
                    <select id="aspectRatio">
                        <option value="16:9" selected>16:9 (Landscape)</option>
                        <option value="9:16">9:16 (Portrait)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="resolution">Resolution</label>
                    <select id="resolution">
                        <option value="720p" selected>720p</option>
                        <option value="1080p">1080p</option>
                    </select>
                </div>

                <button id="generateBtn" class="generate-btn" onclick="generateVideo()">
                    <span id="btnText">Generate Video</span>
                    <span id="btnLoader" class="loader" style="display: none;"></span>
                </button>
            </div>

            <div class="result-section" id="resultSection" style="display: none;">
                <h2>Your Generated Video</h2>
                <div class="video-container" id="videoContainer">
                    <video id="generatedVideo" controls></video>
                </div>
                <div class="video-info">
                    <p id="videoInfo"></p>
                    <a id="downloadBtn" class="download-btn" download>Download Video</a>
                </div>
            </div>

            <div class="history-section">
                <h3>Recent Generations</h3>
                <div id="historyList" class="history-list">
                    <p class="no-history">No videos generated yet</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
