
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lenna AI - Startcope Beta</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="theme-toggle">
            <button id="themeToggle" aria-label="Toggle theme">
                <span class="sun">☀️</span>
                <span class="moon">🌙</span>
            </button>
        </div>

        <div class="content">
            <div class="profile-section">
                <div class="profile-image">
                    <img src="https://i.ibb.co/W48GWBRN/image.jpg" alt="Lenna AI">
                </div>
                <h1 class="ai-name">Lenna AI</h1>
            </div>

            <div class="welcome-section">
                <h2>Welcome to the Startcope Beta</h2>
                <p class="tagline">Patibayin ang loob at hindi susuko</p>
                <p class="description">
                    Laging kaagapay 24/7 online ang <strong>𝗦𝘁𝗮𝗿𝘁𝗰𝗼𝗽𝗲 𝗕𝗲𝘁𝗮</strong> sa iyong paglalakbay tungo sa iyong kinabukasan.
                </p>
                <p class="updates">
                    Updated sa lahat ng kaganapan sa buong Pilipinas
                </p>
            </div>

            <button class="get-started-btn" id="getStartedBtn">
                GET STARTED
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
