
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="profile-section">
                <img src="https://i.ibb.co/prfVyfQ/profile.jpg" alt="Bot Avatar" class="profile-pic">
                <div class="profile-info">
                    <h3>AI Assistant</h3>
                    <span class="status">Active now</span>
                </div>
            </div>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                <img src="https://i.ibb.co/prfVyfQ/profile.jpg" alt="Bot" class="message-avatar">
                <div class="message-content">
                    <p>Hello! Kamusta? Ask me anything!</p>
                </div>
            </div>
        </div>
        
        <div class="chat-input-container">
            <div class="input-wrapper">
                <input type="text" id="messageInput" placeholder="Aa" autocomplete="off">
                <button id="sendButton" class="send-button">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M16.6915026,12.4744748 L3.50612381,13.2599618 C3.19218622,13.2599618 3.03521743,13.4170592 3.03521743,13.5741566 L1.15159189,20.0151496 C0.8376543,20.8006365 0.99,21.89 1.77946707,22.52 C2.41,22.99 3.50612381,23.1 4.13399899,22.8429026 L21.714504,14.0454487 C22.6563168,13.5741566 23.1272231,12.6315722 22.9702544,11.6889879 C22.8132856,10.7464035 22.0274347,9.96491591 21.0856219,9.49362379 L4.13399899,1.28482759 C3.50612381,0.9 2.41,1.16909024 1.77946707,1.8 C0.99,2.5813776 0.8376543,3.67061447 1.15159189,4.45610131 L3.03521743,10.8971043 C3.03521743,11.0542017 3.19218622,11.2112991 3.50612381,11.2112991 L16.6915026,12.4744748 Z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>
    
    <button class="chat-toggle" id="chatToggle">
        <svg viewBox="0 0 28 28" width="28" height="28" fill="white">
            <path d="M14 2.042c6.76 0 12 4.952 12 11.64S20.76 25.322 14 25.322a13.091 13.091 0 0 1-3.474-.461.956 .956 0 0 0-.641.047L7.5 25.959a.961.961 0 0 1-1.348-.849l-.065-2.134a.957.957 0 0 0-.322-.684A11.389 11.389 0 0 1 2 13.682C2 6.994 7.24 2.042 14 2.042ZM6.794 17.086a.57.57 0 0 0 .827.758l3.786-2.874a.722.722 0 0 1 .868 0l2.8 2.1a1.8 1.8 0 0 0 2.6-.481l3.525-5.592a.57.57 0 0 0-.827-.758l-3.786 2.874a.722.722 0 0 1-.868 0l-2.8-2.1a1.8 1.8 0 0 0-2.6.481Z"></path>
        </svg>
    </button>

    <script src="script.js"></script>
</body>
</html>
