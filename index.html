
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAR SAVINGS - Your Digital Piggy Bank</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Login/Register Screen -->
    <div class="auth-container" id="authContainer">
        <div class="auth-card">
            <h1>⭐ STAR SAVINGS</h1>
            <p class="tagline">Save Smart, Grow Rich</p>
            
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="showLogin()">Login</button>
                <button class="auth-tab" onclick="showRegister()">Register</button>
            </div>

            <!-- Login Form -->
            <div id="loginForm" class="auth-form">
                <input type="tel" id="loginMobile" placeholder="Mobile Number (09xxxxxxxxx)" maxlength="11">
                <input type="password" id="loginPin" placeholder="4-Digit PIN" maxlength="4">
                <button onclick="login()">Login</button>
            </div>

            <!-- Register Form -->
            <div id="registerForm" class="auth-form" style="display: none;">
                <input type="text" id="regName" placeholder="Full Name">
                <input type="tel" id="regMobile" placeholder="Mobile Number (09xxxxxxxxx)" maxlength="11">
                <input type="password" id="regPin" placeholder="Create 4-Digit PIN" maxlength="4">
                <input type="password" id="regConfirmPin" placeholder="Confirm PIN" maxlength="4">
                <button onclick="register()">Register</button>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div class="app-container" id="appContainer" style="display: none;">
        <!-- Header -->
        <div class="app-header">
            <div class="user-info">
                <h2 id="userName">Welcome!</h2>
                <p id="userMobile"></p>
            </div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <!-- Balance Card -->
        <div class="balance-card">
            <p class="balance-label">Total Savings</p>
            <h1 class="balance-amount" id="balanceAmount">₱0.00</h1>
            <p class="last-update" id="lastUpdate">Last updated: Never</p>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">
            <button class="action-btn deposit-btn" onclick="showDepositModal()">
                <span class="icon">💰</span>
                <span>Deposit</span>
            </button>
            <button class="action-btn withdraw-btn" onclick="showWithdrawModal()">
                <span class="icon">💸</span>
                <span>Withdraw</span>
            </button>
            <button class="action-btn gcash-btn" onclick="showGCashModal()">
                <span class="icon">📱</span>
                <span>GCash</span>
            </button>
        </div>

        <!-- Transaction History -->
        <div class="transaction-section">
            <h3>Transaction History</h3>
            <div class="transaction-list" id="transactionList">
                <p class="no-transactions">No transactions yet</p>
            </div>
        </div>
    </div>

    <!-- Deposit Modal -->
    <div class="modal" id="depositModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('depositModal')">&times;</span>
            <h2>💰 Deposit Money</h2>
            <div class="modal-body">
                <input type="number" id="depositAmount" placeholder="Enter amount">
                <input type="text" id="depositNote" placeholder="Note (optional)">
                <button class="modal-btn" onclick="deposit()">Deposit</button>
            </div>
        </div>
    </div>

    <!-- Withdraw Modal -->
    <div class="modal" id="withdrawModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('withdrawModal')">&times;</span>
            <h2>💸 Withdraw Money</h2>
            <div class="modal-body">
                <input type="number" id="withdrawAmount" placeholder="Enter amount">
                <input type="text" id="withdrawNote" placeholder="Note (optional)">
                <input type="password" id="withdrawPin" placeholder="Enter PIN to confirm" maxlength="4">
                <button class="modal-btn" onclick="withdraw()">Withdraw</button>
            </div>
        </div>
    </div>

    <!-- GCash Modal -->
    <div class="modal" id="gcashModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('gcashModal')">&times;</span>
            <h2>📱 GCash Transfer</h2>
            <div class="modal-body">
                <div class="gcash-tabs">
                    <button class="gcash-tab active" onclick="showGCashDeposit()">Deposit from GCash</button>
                    <button class="gcash-tab" onclick="showGCashWithdraw()">Send to GCash</button>
                </div>

                <!-- GCash Deposit -->
                <div id="gcashDepositForm" class="gcash-form">
                    <input type="tel" id="gcashDepositNumber" placeholder="GCash Number (09xxxxxxxxx)" maxlength="11">
                    <input type="number" id="gcashDepositAmount" placeholder="Amount">
                    <input type="text" id="gcashDepositRef" placeholder="Reference Number">
                    <button class="modal-btn" onclick="gcashDeposit()">Submit Deposit</button>
                </div>

                <!-- GCash Withdraw -->
                <div id="gcashWithdrawForm" class="gcash-form" style="display: none;">
                    <input type="tel" id="gcashWithdrawNumber" placeholder="GCash Number (09xxxxxxxxx)" maxlength="11">
                    <input type="number" id="gcashWithdrawAmount" placeholder="Amount">
                    <input type="password" id="gcashWithdrawPin" placeholder="Enter PIN" maxlength="4">
                    <button class="modal-btn" onclick="gcashWithdraw()">Send to GCash</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
