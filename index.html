<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World FM Radio - Listen to Millions of Radio Stations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📻 World FM Radio</h1>
            <p class="subtitle">Listen to millions of radio stations from around the world</p>
        </header>

        <div class="player-section">
            <div class="now-playing-card" id="nowPlayingCard">
                <div class="station-logo">
                    <img id="stationLogo" src="" alt="Station Logo" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📻</text></svg>'">
                </div>
                <div class="station-info">
                    <h2 id="stationName">Select a radio station</h2>
                    <p id="stationCountry">Choose from countries below</p>
                    <p id="stationTags"></p>
                </div>
                <div class="player-controls">
                    <button id="playBtn" class="play-btn" disabled>
                        <span id="playIcon">▶️</span>
                    </button>
                    <div class="volume-control">
                        <span>🔊</span>
                        <input type="range" id="volumeSlider" min="0" max="100" value="70">
                    </div>
                </div>
            </div>
        </div>

        <div class="search-section">
            <input type="text" id="searchInput" placeholder="🔍 Search radio stations by name, country, or genre...">
        </div>

        <div class="filter-section">
            <div class="filter-group">
                <label>Filter by Country:</label>
                <select id="countryFilter">
                    <option value="">All Countries</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Filter by Genre:</label>
                <select id="genreFilter">
                    <option value="">All Genres</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Sort by:</label>
                <select id="sortBy">
                    <option value="votes">Most Popular</option>
                    <option value="name">Name (A-Z)</option>
                    <option value="clickcount">Most Played</option>
                </select>
            </div>
        </div>

        <div class="stats-section">
            <div class="stat-card">
                <h3 id="totalStations">0</h3>
                <p>Radio Stations</p>
            </div>
            <div class="stat-card">
                <h3 id="totalCountries">0</h3>
                <p>Countries</p>
            </div>
            <div class="stat-card">
                <h3 id="nowListening">0</h3>
                <p>Listeners Worldwide</p>
            </div>
        </div>

        <div class="stations-section">
            <h3>Radio Stations</h3>
            <div id="loadingIndicator" class="loading">Loading stations...</div>
            <div id="stationsList" class="stations-grid"></div>
        </div>

        <div class="popular-countries">
            <h3>Popular Countries</h3>
            <div class="country-chips" id="popularCountries"></div>
        </div>
    </div>

    <audio id="audioPlayer" preload="none"></audio>
    <script src="script.js"></script>
</body>
</html>
